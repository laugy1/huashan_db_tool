events:
  truncate: false
  batch_size: 500

# 活動圖片階段二（--task events-images）
events_images:
  mode: upload          # lookup：對照 media 既有檔案；upload：下載舊站圖並上傳 CMS
  reupload: false
  remove_legacy_images: true

